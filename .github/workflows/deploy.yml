name: Deploy & Cleanup Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Debug Vercel config
        run: |
          echo "org id length: ${#VERCEL_ORG_ID}"
          echo "project id length: ${#VERCEL_PROJECT_ID}"
          echo "token length: ${#VERCEL_TOKEN}"

          echo "API check (project settings):"
          curl -s -o /dev/null -w "%{http_code}\n" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"

          vercel whoami --token "$VERCEL_TOKEN" || true
          vercel project ls --token "$VERCEL_TOKEN" || true
          
      - name: Deploy to Vercel
        run: |
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

      - name: Clean Up Unused Deployments
        run: |
          # Deletes unused preview deployments for this project
          vercel rm $VERCEL_PROJECT_ID --safe --yesc